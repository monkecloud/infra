apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This person's shared credentials — the Postgres role and the Garage key they own. An
# app overlay lists this directory, and its `namespace:` puts a copy in that app's
# namespace. Secrets do not cross namespaces, so each app namespace gets its own copy of
# the same value.
resources:
  - pg.sops.yaml
  - garage.sops.yaml
