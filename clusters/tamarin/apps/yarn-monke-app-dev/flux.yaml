# The app's own repo, and the Kustomization that applies it. Both live in this namespace
# because kustomize-controller impersonates the ServiceAccount of the namespace the
# Kustomization is in — `deployer`, from ../base.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app
spec:
  interval: 1m
  url: ssh://git@github.com/monkecloud/monke-app
  ref:
    # development. The two branches deploy identical manifests apart from the database key
    # and the hostname.
    branch: dev
  # A read-only deploy key for this repo alone. Nothing in the cluster can write to GitHub.
  secretRef:
    name: git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
spec:
  interval: 5m
  path: ./k8s
  prune: true
  # A bad manifest fails the whole set loudly rather than half-applying it.
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: app
  targetNamespace: yarn-monke-app-dev
  serviceAccountName: deployer
  # The only two things that differ between prod and dev. They live here, not on the dev
  # branch: the app repo's manifests stay identical on both branches, so a promotion only
  # ever conflicts on the CI-written image tag, and this overlay is what makes dev a
  # different environment.
  patches:
    # The scratch database, not the production one. A strategic merge, so it matches the
    # container and the env var by name — a positional JSON patch would silently rewrite
    # the wrong variable the first time someone reorders the list.
    - target:
        kind: Deployment
        name: monke-app
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: monke-app
        spec:
          template:
            spec:
              containers:
                - name: app
                  env:
                    - name: DATABASE_URL
                      valueFrom:
                        secretKeyRef:
                          name: yarn-pg
                          key: uri_dev
    # Its own hostname. Two Ingresses claiming one host would fight over a single
    # certificate, and cert-manager would issue for whichever asked last.
    - target:
        kind: Ingress
        name: monke-app
      patch: |
        - op: replace
          path: /spec/tls/0/hosts/0
          value: app-dev.monke.ca
        - op: replace
          path: /spec/rules/0/host
          value: app-dev.monke.ca
