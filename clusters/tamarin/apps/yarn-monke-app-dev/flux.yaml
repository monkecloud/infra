# The app's own repo, and the Kustomization that applies it. Both live in this namespace
# because kustomize-controller impersonates the ServiceAccount of the namespace the
# Kustomization is in — `deployer`, from ../base.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app
spec:
  interval: 1m
  url: ssh://git@github.com/monkecloud/art-monke
  ref:
    # development. The two branches deploy identical manifests apart from the database key
    # and the hostname.
    branch: dev
  # A read-only deploy key for this repo alone. Nothing in the cluster can write to GitHub.
  secretRef:
    name: git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
spec:
  interval: 5m
  path: ./k8s
  prune: true
  # A bad manifest fails the whole set loudly rather than half-applying it.
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: app
  targetNamespace: yarn-monke-app-dev
  serviceAccountName: deployer
  # The one thing that differs between prod and dev. It lives here, not on the dev
  # branch: the app repo's manifests stay identical on both branches, so a promotion only
  # ever conflicts on the CI-written image tags, and this overlay is what makes dev a
  # different environment.
  #
  # The database used to be patched here too, on the monke-app Deployment's DATABASE_URL.
  # It is not any more: that only ever reached one Deployment by name, so the app's api
  # would have kept the production value in silence. Which database an environment uses is
  # now ConfigMap monke-app-db, applied per namespace — missing it fails the pod loudly
  # rather than pointing it at the wrong data.
  patches:
    # Its own hostname. Two Ingresses claiming one host would fight over a single
    # certificate, and cert-manager would issue for whichever asked last.
    - target:
        kind: Ingress
        name: monke-app
      patch: |
        - op: replace
          path: /spec/tls/0/hosts/0
          value: app-dev.monke.ca
        - op: replace
          path: /spec/rules/0/host
          value: app-dev.monke.ca
