# rather than shared from ../_owners/yarn on purpose: one key per app-environment means dev
# cannot read or delete prod's objects, which the owner-wide yarn-data-key could not offer.
#
# The bucket and the key are Garage CLI objects with no Kubernetes representation, so they
# are created out of band; this file is the only place their credentials are recorded.
