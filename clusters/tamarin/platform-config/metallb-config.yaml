---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress-vip
  namespace: metallb-system
spec:
  addresses:
  - 192.168.2.200/32
  autoAssign: false
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ingress-vip
  namespace: metallb-system
spec:
  ipAddressPools:
  - ingress-vip
