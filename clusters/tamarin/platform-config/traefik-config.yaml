---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    deployment:
      replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    ports:
      web:
        http:
          redirections:
            # Every public hostname here is issued a certificate by cert-manager, so plain
            # HTTP has no legitimate use: redirect it rather than serving the app in the
            # clear. Cluster-wide on purpose — an app repo cannot forget it, and it cannot
            # become a per-branch difference in someone's k8s/.
            #
            # This belongs in `ports`, NOT in additionalArguments. The chart renders
            # `...redirections.entryPoint.to=:{{ ports.websecure.exposedPort }}` — the
            # published 443. Hand-writing `to=websecure` instead makes Traefik build the
            # Location header from the target entrypoint's in-container address and emit
            # https://host:8443/, a port the router does not forward, so every plain-HTTP
            # visitor hangs. There is no `port` field to correct that with: Traefik rejects
            # one outright ("field not found, node: port") and crashloops. Both mistakes
            # were made here on 2026-09-09; the chart value avoids both.
            #
            # ACME HTTP-01 keeps working: Let's Encrypt follows the redirect and does not
            # verify the certificate it lands on, so a first issuance for a brand-new
            # hostname still validates against Traefik's default cert.
            entryPoint:
              to: websecure
              scheme: https
    service:
      annotations:
        metallb.universe.tf/address-pool: ingress-vip
      spec:
        # Only nodes running a ready Traefik pod announce the VIP, and
        # traffic never takes an extra hop to a dead node.
        externalTrafficPolicy: Local
    additionalArguments:
      # Fail fast to a dead backend so the retry happens quickly
      - "--serversTransport.forwardingTimeouts.dialTimeout=500ms"
      - "--entryPoints.websecure.http.middlewares=kube-system-retry@kubernetescrd"
      - "--entryPoints.web.http.middlewares=kube-system-retry@kubernetescrd"
