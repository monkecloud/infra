apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operators.yaml      # cert-manager, CNPG, MetalLB as k3s HelmChart CRs
  - garage.yaml
  - kube-vip.yaml       # control-plane VIP 192.168.2.201
  - kube-router.yaml    # NetworkPolicy enforcement — tenant isolation depends on this
  # Tailscale operator + its OAuth credentials. Remote access for off-LAN admin work;
  # the subnet routers themselves are in platform-config, which needs these CRDs first.
  - tailscale.yaml
  - tailscale--operator-oauth.sops.yaml
