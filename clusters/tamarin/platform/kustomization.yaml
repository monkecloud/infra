apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operators.yaml      # cert-manager, CNPG, MetalLB as k3s HelmChart CRs
  - garage.yaml
  - kube-vip.yaml       # control-plane VIP 192.168.2.201
  - kube-router.yaml    # NetworkPolicy enforcement — tenant isolation depends on this
  # Tailscale operator + its OAuth credentials. Commented out until the OAuth client
  # exists: `wait: true` on this Kustomization means an operator that cannot authenticate
  # would hold back platform-config and workloads too. See scripts/tailscale-oauth.sh.
  # - tailscale.yaml
  # - tailscale--operator-oauth.sops.yaml
