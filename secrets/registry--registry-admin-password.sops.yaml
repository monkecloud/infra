# The registry's `admin` password, in plaintext.
#
# Why this exists separately: `registry-auth` stores htpasswd **bcrypt hashes**, which are
# one-way. A rebuild restores that Secret, so the registry comes back accepting this
# password — but the password itself cannot be derived from the hash. Tenant passwords do
# not need this because each tenant's `registry-creds` holds base64(user:password), which is
# reversible; nothing pulls as admin, so admin has no registry-creds.
#
# Not applied by Flux. Nothing consumes it — it is here so a rebuild does not lose it.
# To rotate: generate a new bcrypt entry, update registry-auth, and update this file.
apiVersion: v1
kind: Secret
metadata:
    name: registry-admin-password
    namespace: registry
type: Opaque
