# TEMPLATE — not applied. Copy into clusters/tamarin/projects/<name>.yaml and edit
# when a project repo actually exists. Replace 'yarn' with the tenant whose namespace
# the project deploys into, and the url with the project's repo.
#
# The serviceAccountName line is the important one: Flux applies the project's manifests
# AS that tenant, so a project repo can only create what the tenant's Role already
# permits. That is what makes an untrusted repo safe to reconcile.
# Flux wiring for the "yarn" tenant.
#
# The Kustomization applies the tenant's manifests while impersonating their existing
# yarn-user ServiceAccount. That is the whole point of this file: whatever a tenant
# commits, Flux can only apply what their Role already allows. The RBAC boundary and the
# deploy boundary are the same thing, so a tenant repo is not a privileged input.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: yarn
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/monkecloud/yarn-app
  ref:
    branch: master
  # Private repo: a Secret holding a PAT or deploy key. Created by bootstrap-tenant.sh.
  secretRef:
    name: yarn-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yarn
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: yarn
  # Apply as the tenant, never as Flux itself.
  targetNamespace: yarn
  serviceAccountName: yarn-user
  # Surface a bad manifest as a failed Kustomization rather than a half-applied state.
  wait: true
  timeout: 3m
