# TEMPLATE — not applied. Copy into a project repo's k8s/ and replace APP with the
# project's name, then add it to that repo's kustomization.
#
# A cache is per-repo, not per-namespace: every project that wants one ships this file.
# Several projects share a namespace, so every name here is prefixed with the project
# name — two repos in one namespace must not collide on `redis`.
#
# It is best-effort by design: one pod, one node, a local-path PVC. It survives a pod
# restart, is unavailable while its node is down, and is GONE if that node is lost.
# Nothing here is backed up or replicated. Use it as a cache, a lock, a rate limiter, or
# a queue you can rebuild — anything durable belongs in Postgres or Garage.
#
# The password lives in a Secret named APP-redis, key `password`. Either commit it
# SOPS-encrypted in the project repo (needs the cluster age key), or create it once:
#
#   kubectl -n <namespace> create secret generic APP-redis \
#     --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=')"
#
# Regenerating it is safe — restart the StatefulSet and the app afterwards.
---
apiVersion: v1
kind: Service
metadata:
  name: APP-redis
  labels:
    app: APP-redis
spec:
  type: ClusterIP
  selector:
    app: APP-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: APP-redis
spec:
  serviceName: APP-redis
  replicas: 1
  selector:
    matchLabels:
      app: APP-redis
  template:
    metadata:
      labels:
        app: APP-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - 'yes'
            - --dir
            - /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: APP-redis, key: password }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping']
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
